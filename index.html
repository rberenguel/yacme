<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="media/favicon.ico" type="image/x-icon" />
    <title>YACME: Yet Another Concept Map Editor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="fonts/iconoir/iconoir-font.css">
    <link rel="manifest" href="manifest.json" />

    <script type="importmap">
      {
        "imports": {
          "CodeMirrorBundle": "./bundles/codemirror-bundle.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="container">
      <div id="editor-pane" class="editor-pane"></div>
      <div id="resizer"></div>
      <div class="diagram-pane">
        <svg id="diagram-container">
          <defs>
            <marker
              id="arrowhead"
              viewBox="0 -5 10 10"
              refX="10"
              refY="0"
              markerWidth="6"
              markerHeight="6"
              orient="auto"
            >
              <path d="M0,-5L10,0L0,5" fill="#cb4b16"></path>
            </marker>
          </defs>
          <g id="zoom-group">
            <g id="links"></g>
            <g id="nodes"></g>
          </g>
        </svg>
      </div>
      </div>
    </div>

    <script src="libs/d3v7.js"></script>
    <script src="libs/dagre.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
